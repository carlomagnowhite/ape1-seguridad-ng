<!-- Modal adaptado -->
<form (ngSubmit)="onSubmit()" [formGroup]="ngForm">

  <div *ngIf="open"
    class="fixed inset-0 z-[999] grid h-screen w-screen place-items-center bg-black bg-opacity-60 backdrop-blur-sm transition-opacity duration-300"
    [ngClass]="{'opacity-100 pointer-events-auto': open, 'opacity-0 pointer-events-none': !open}">
    <div class="relative mx-auto w-full max-w-[24rem] rounded-lg overflow-hidden shadow-sm">
      <div class="relative flex flex-col bg-white">
        <div class="relative m-2.5 items-center flex justify-center text-white h-24 rounded-md bg-slate-800">
          <h3 class="text-2xl">
            Añadir y cifrar
          </h3>
          <button (click)="closeModal()" class="absolute right-2 top-2 text-white hover:text-gray-200 rounded-full p-1">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
              stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
        <div class="flex flex-col gap-4 p-6">
          <div class="w-full max-w-sm min-w-[200px]">
            <label class="block mb-2 text-sm text-slate-600">
              Nombre
            </label>
            <input type="text"
              class="w-full bg-transparent placeholder:text-slate-400 text-slate-700 text-sm border border-slate-200 rounded-md px-3 py-2 transition duration-300 ease focus:outline-none focus:border-slate-400 hover:border-slate-300 shadow-sm focus:shadow"
              placeholder="Nombre del miembro" formControlName="name" />
          </div>

          <div class="w-full max-w-sm min-w-[200px]">
            <label class="block mb-2 text-sm text-slate-600">
              Apellido
            </label>
            <input type="text"
              class="w-full bg-transparent placeholder:text-slate-400 text-slate-700 text-sm border border-slate-200 rounded-md px-3 py-2 transition duration-300 ease focus:outline-none focus:border-slate-400 hover:border-slate-300 shadow-sm focus:shadow"
              placeholder="Apellido del miembro" formControlName="lastname" />
          </div>

          <div class="w-full max-w-sm min-w-[200px]">
            <label class="block mb-2 text-sm text-slate-600">
              Correo
            </label>
            <input type="email"
              class="w-full bg-transparent placeholder:text-slate-400 text-slate-700 text-sm border border-slate-200 rounded-md px-3 py-2 transition duration-300 ease focus:outline-none focus:border-slate-400 hover:border-slate-300 shadow-sm focus:shadow"
              placeholder="Correo electrónico" formControlName="email" />
          </div>
        </div>
        <div class="p-6 pt-0">
          <button
          class="w-full rounded-md bg-slate-800 py-2 px-4 border border-transparent text-center text-sm text-white transition-all shadow-md hover:shadow-lg focus:bg-slate-700 focus:shadow-none active:bg-slate-700 hover:bg-slate-700 active:shadow-none disabled:pointer-events-none disabled:opacity-50 disabled:shadow-none"
          type="button"
          (click)="onSubmitEncrypt()">
          Cifrar
        </button>
          <button
            class="w-full rounded-md bg-slate-800 py-2 px-4 border border-transparent text-center text-sm text-white transition-all shadow-md hover:shadow-lg focus:bg-slate-700 focus:shadow-none active:bg-slate-700 hover:bg-slate-700 active:shadow-none disabled:pointer-events-none disabled:opacity-50 disabled:shadow-none"
            type="button"
            (click)="onSubmit()">
            Guardar
          </button>
        </div>
      </div>
    </div>
  </div>
</form>
